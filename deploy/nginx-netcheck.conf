# Nginx reverse proxy: port 80 -> Node app on 127.0.0.1:3000.
# Installed to /etc/nginx/conf.d/netcheck.conf by setup-ec2.sh.
# The ALB (or a curl from inside the VPC) hits port 80; the app itself is never exposed directly.

upstream netcheck_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 5m;

    # Cheap health check answered by the app, without access-log noise from the ALB.
    location = /api/v1/health {
        access_log off;
        proxy_pass http://netcheck_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://netcheck_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
